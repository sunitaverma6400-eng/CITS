name: draughtsman_flashcards
description: Draughtsman Mechanical - ITI Study App (Flashcards, Learn Mode, Study Guides, Quiz)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_card_swiper: ^7.0.1
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/flashcards_data.json
    - assets/images/trade_theory/
    - assets/images/trade_practical/
    - assets/images/training_methodology/
